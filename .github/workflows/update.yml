name: Check for updates

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Bump OpenCode, base image and tools
        id: bump
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "version=$(node scripts/update-deps.mjs)" >> "$GITHUB_OUTPUT"

      # One rolling pull request, rebuilt from main each day so it never conflicts
      - name: Open or refresh the pull request
        if: steps.bump.outputs.version != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          branch=update/dependencies
          title="Update to ${VERSION} (OpenCode $(jq -r .upstreamVersion CloudronManifest.json))"
          body=$(printf 'Automated update. Changes:\n\n%s\n\nThe Build run for this branch builds the image and runs the smoke and upgrade tests. Merging adds %s to CloudronVersions.json as **testing**; run the Release workflow to publish it.' \
            "$(node scripts/versions.mjs notes "${VERSION}")" "${VERSION}")

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "${branch}"
          git commit -qam "${title}"

          if git fetch -q --depth 1 origin "${branch}" 2>/dev/null && git diff --quiet FETCH_HEAD HEAD; then
            echo "Pull request is already up to date"
            exit 0
          fi

          git push --force origin "${branch}"
          pr=$(gh pr list --head "${branch}" --state open --json number --jq '.[0].number')
          if [[ -n "${pr}" ]]; then
            gh pr edit "${pr}" --title "${title}" --body "${body}"
          else
            gh pr create --head "${branch}" --title "${title}" --body "${body}"
          fi
          # Pull requests opened with GITHUB_TOKEN don't trigger workflows, so start the build directly
          gh workflow run build.yml --ref "${branch}"
