name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/opencode-cloudron

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Read package version
        id: meta
        run: |
          version=$(jq -r .version CloudronManifest.json)
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          if [[ -f CloudronVersions.json ]] && jq -e --arg v "${version}" '.versions[$v]' CloudronVersions.json >/dev/null; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: opencode-cloudron:test
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: test/smoke.sh opencode-cloudron:test

      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && steps.meta.outputs.published == 'false'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image and publish version
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && steps.meta.outputs.published == 'false'
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          docker tag opencode-cloudron:test "${IMAGE}:${VERSION}"
          docker tag opencode-cloudron:test "${IMAGE}:latest"
          docker push "${IMAGE}:${VERSION}"
          docker push "${IMAGE}:latest"

          node scripts/publish-version.mjs "${IMAGE}:${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CloudronVersions.json
          git commit -m "Publish ${VERSION}"
          git push
