name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/opencode-cloudron

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Read package version
        id: meta
        run: |
          version=$(jq -r .version CloudronManifest.json)
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "state=$(node scripts/versions.mjs get "${version}")" >> "$GITHUB_OUTPUT"
          # The newest version users can have installed, to test upgrading from it
          previous=$(jq -r --arg v "${version}" '[.versions | to_entries[] | select(.key != $v and .value.publishState != "revoked")]
            | sort_by(.key | split(".") | map(tonumber)) | last | .value.manifest.dockerImage // empty' CloudronVersions.json)
          echo "previous_image=${previous}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: opencode-cloudron:test
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: test/smoke.sh opencode-cloudron:test "${{ steps.meta.outputs.previous_image }}"

      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && steps.meta.outputs.state == ''
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image and add the version as testing
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && steps.meta.outputs.state == ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          docker tag opencode-cloudron:test "${IMAGE}:${VERSION}"
          docker push "${IMAGE}:${VERSION}"

          node scripts/versions.mjs add "${IMAGE}:${VERSION}" --state testing
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CloudronVersions.json
          git commit -m "Add ${VERSION} for testing"
          git push

          node scripts/versions.mjs notes "${VERSION}" > notes.md
          printf '\n\nThis version is in **testing**. Cloudron shows it as unstable until it is released.\n' >> notes.md
          gh release create "v${VERSION}" --target "$(git rev-parse HEAD)" --prerelease \
            --title "${VERSION} (OpenCode $(jq -r .upstreamVersion CloudronManifest.json))" --notes-file notes.md
